name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  local:
    name: Build + Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "Run gofmt on listed files" && gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Run local CI suite
        run: make ci-local

  connected:
    name: ConfigHub Smoke
    needs: local
    runs-on: ubuntu-latest
    env:
      CONFIGHUB_BASE_URL: ${{ secrets.CONFIGHUB_BASE_URL }}
      CONFIGHUB_SPACE: ${{ secrets.CONFIGHUB_SPACE }}
      CONFIGHUB_TOKEN: ${{ secrets.CONFIGHUB_TOKEN }}
      CONFIGHUB_USER: ci-bot
      RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine connected prerequisites
        id: connected-preflight
        run: |
          missing=()
          for v in \
            CONFIGHUB_BASE_URL \
            CONFIGHUB_SPACE \
            CONFIGHUB_TOKEN; do
            if [ -z "${!v}" ]; then
              missing+=("$v")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "can_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "can_run=false" >> "$GITHUB_OUTPUT"
          missing_csv="$(IFS=,; echo "${missing[*]}")"
          echo "missing=$missing_csv" >> "$GITHUB_OUTPUT"

      - name: Skip connected smoke suite (missing ConfigHub credentials)
        if: steps.connected-preflight.outputs.can_run != 'true'
        run: |
          echo "Skipping connected smoke suite."
          echo "Missing required values: ${{ steps.connected-preflight.outputs.missing }}"
          {
            echo "### ConfigHub Smoke skipped";
            echo "";
            echo "Missing required values:";
            echo "";
            echo '```';
            echo "${{ steps.connected-preflight.outputs.missing }}";
            echo '```';
            echo "";
            echo "To run ConfigHub Smoke, set CONFIGHUB_BASE_URL, CONFIGHUB_SPACE, and CONFIGHUB_TOKEN.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        if: steps.connected-preflight.outputs.can_run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build cub CLI for connected scripts
        if: steps.connected-preflight.outputs.can_run == 'true'
        run: |
          gh release download --repo confighub/sdk --pattern 'cub-linux-amd64' --dir /tmp/cub-download
          install -m 755 /tmp/cub-download/cub-linux-amd64 /usr/local/bin/cub
          cub version

      - name: Run ConfigHub smoke suite
        if: steps.connected-preflight.outputs.can_run == 'true'
        run: make ci-connected
