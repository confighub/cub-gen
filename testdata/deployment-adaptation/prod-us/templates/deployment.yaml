apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: {{ .Values.service.namespace | quote }}
spec:
  template:
    spec:
      containers:
        - name: checkout-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: DATABASE_URL
              value: {{ .Values.connections.databaseUrl | quote }}
