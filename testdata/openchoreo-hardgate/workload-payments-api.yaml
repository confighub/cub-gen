apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: payments-api
spec:
  componentTypeRef: web-service
  containers:
    main:
      image: ghcr.io/acme/payments-api:v1.4.2
      env:
        LOG_LEVEL: info
      files:
        LOG_FORMAT:
          value: json
          mountPath: /etc/payments/log-format
  service:
    port: 8080
  resources:
    limits:
      cpu: "500m"
  secretRef: payments-db
