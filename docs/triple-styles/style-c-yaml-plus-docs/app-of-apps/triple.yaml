kind: "app-of-apps"
profile: "app-of-apps"
resource_kind: "Application"
resource_type: "argoproj.io/v1alpha1/Application"
capabilities:
  - "root-application"
  - "child-application-catalog"
  - "observed-expansion"
  - "inverse-app-catalog-patch"
contract:
  default_input_role: "argo-application"
  default_owner: "app-catalog-owner"
  input_role_rules:
    - role: "root-application"
      exact_basenames:
        - "root-application.yaml"
        - "root-application.yml"
        - "root-app.yaml"
        - "root-app.yml"
        - "app-of-apps.yaml"
        - "app-of-apps.yml"
    - role: "child-application"
      path_prefixes:
        - "apps/"
        - "applications/"
      extensions:
        - ".yaml"
        - ".yml"
  role_owners:
    child-application: "app-catalog-owner"
    root-application: "platform-engineer"
  role_schema_refs:
    child-application: "https://schema.confighub.dev/generators/app-of-apps-child-v1"
    root-application: "https://schema.confighub.dev/generators/app-of-apps-root-v1"
  wet_targets:
    - kind: "Application"
      name_template: "{{name}}"
      owner: "platform-runtime"
      namespace: "argocd"
      source_dry_path_template: "spec.source.path"
provenance:
  field_origin_transform: "app-of-apps-catalog"
  field_origin_overlay_transform: "app-of-apps-root-expansion"
  field_origin_confidences:
    child_name: 0.92
    root_path: 0.88
    source_path: 0.90
    source_repo: 0.90
  rendered_lineage_templates:
    - kind: "Application"
      name_template: "{{name}}"
      namespace: "argocd"
      source_path_hint: "root_application_path"
      source_dry_path_template: "spec.source.path"
inverse:
  inverse_patch_templates:
    child_name:
      editable_by: "app-catalog-owner"
      confidence: 0.92
    root_path:
      editable_by: "platform-engineer"
      confidence: 0.88
      requires_review: true
    source_path:
      editable_by: "app-catalog-owner"
      confidence: 0.90
      requires_review: true
    source_repo:
      editable_by: "app-catalog-owner"
      confidence: 0.90
      requires_review: true
  inverse_pointer_templates:
    child_name:
      owner: "app-catalog-owner"
      confidence: 0.92
    root_path:
      owner: "platform-engineer"
      confidence: 0.88
    source_path:
      owner: "app-catalog-owner"
      confidence: 0.90
    source_repo:
      owner: "app-catalog-owner"
      confidence: 0.90
  inverse_patch_reasons:
    child_name: "Child Application identity is owned by the child app catalog."
    root_path: "The root Application controls which catalog path is expanded."
    source_path: "Child Application source path is selected by the child app catalog."
    source_repo: "Child Application repo URL is selected by the child app catalog."
  inverse_edit_hints:
    child_name: "Route: apply-here. Edit metadata.name in {{child_application_path}}."
    root_path: "Route: lift-upstream. Edit spec.source.path in {{root_application_path}} to change the child app catalog."
    source_path: "Route: apply-here. Edit spec.source.path in {{child_application_path}}."
    source_repo: "Route: apply-here. Edit spec.source.repoURL in {{child_application_path}}."
hints:
  defaults:
    child_catalog_path: "apps"
    root_application_path: "root-application.yaml"
