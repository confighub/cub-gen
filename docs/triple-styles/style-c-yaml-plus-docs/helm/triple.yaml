kind: "helm"
profile: "helm-paas"
resource_kind: "HelmRelease"
resource_type: "helm.toolkit.fluxcd.io/v2/HelmRelease"
capabilities:
  - "render-manifests"
  - "values-overrides"
  - "inverse-values-patch"
contract:
  default_input_role: "helm-input"
  default_owner: "platform-engineer"
  input_role_rules:
    - role: "chart"
      exact_basenames:
        - "chart.yaml"
    - role: "application-set"
      exact_basenames:
        - "applicationset.yaml"
        - "applicationset.yml"
    - role: "cluster-inventory"
      path_prefixes:
        - "platform/clusters/"
      extensions:
        - ".yaml"
        - ".yml"
        - ".json"
    - role: "managed-service-catalog"
      path_prefixes:
        - "platform/catalogs/managed-service-catalog/"
      extensions:
        - ".yaml"
        - ".yml"
        - ".json"
    - role: "customer-service-catalog"
      path_prefixes:
        - "platform/catalogs/customer-service-catalog/"
      extensions:
        - ".yaml"
        - ".yml"
        - ".json"
    - role: "values"
      prefixes:
        - "values"
      extensions:
        - ".yaml"
        - ".yml"
  role_owners:
    customer-service-catalog: "app-team"
    values: "app-team"
  role_schema_refs:
    chart: "https://json.schemastore.org/chart"
  wet_targets:
    - kind: "HelmRelease"
      name_template: "{{name}}"
      owner: "platform-runtime"
      namespace: "apps"
    - kind: "Deployment"
      name_template: "{{name}}"
      owner: "platform-runtime"
      namespace: "apps"
      source_dry_path_template: "values.image.tag"
    - kind: "Service"
      name_template: "{{name}}"
      owner: "platform-runtime"
      namespace: "apps"
      source_dry_path_template: "values.service.port"
provenance:
  field_origin_transform: "helm-template"
  field_origin_overlay_transform: "helm-values-overlay"
  field_origin_confidences:
    image_tag_base: 0.86
    image_tag_overlay: 0.90
  rendered_lineage_templates:
    - kind: "HelmRelease"
      name_template: "{{name}}"
      namespace: "apps"
      source_path_hint: "chart_path"
      source_dry_path_template: "Chart.yaml"
    - kind: "Deployment"
      name_template: "{{name}}"
      namespace: "apps"
      source_path_hint: "values_paths"
      source_path_hint_fallback: "chart_path"
      source_path_hint_multi: true
      source_dry_path_template: "values.image.tag"
    - kind: "Service"
      name_template: "{{name}}"
      namespace: "apps"
      source_path_hint: "values_paths"
      source_path_hint_fallback: "chart_path"
      source_path_hint_multi: true
      source_dry_path_template: "values.service.port"
inverse:
  inverse_patch_templates:
    image_tag:
      editable_by: "app-team"
      confidence: 0.86
  inverse_pointer_templates:
    image_tag:
      owner: "app-team"
      confidence: 0.86
  inverse_patch_reasons:
    image_tag: "Container image tag maps cleanly to helm values."
  inverse_edit_hints:
    image_tag_base: "Edit values.image.tag in {{base_values_path}}."
    image_tag_overlay: "Edit values.image.tag in {{overlay_values_path}} for environment-specific overrides; use {{base_values_path}} for defaults."
hints:
  defaults:
    chart_path: "Chart.yaml"
    chart_role: "chart"
    primary_values_path: "values.yaml"
    values_role: "values"
