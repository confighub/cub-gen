kind: "openchoreo"
profile: "openchoreo"
resource_kind: "Workload"
resource_type: "openchoreo.dev/v1alpha1/Workload"
capabilities:
  - "platform-crds"
  - "rendered-release"
  - "generated-resource-ownership"
  - "inverse-route-patch"
  - "adoption-report"
contract:
  default_input_role: "openchoreo-input"
  default_owner: "platform-engineer"
  input_role_rules:
    - role: "workload"
      prefixes:
        - "workload-"
      extensions:
        - ".yaml"
        - ".yml"
    - role: "workload"
      exact_basenames:
        - "workload.yaml"
        - "workload.yml"
    - role: "component-type"
      prefixes:
        - "component-type-"
      extensions:
        - ".yaml"
        - ".yml"
    - role: "component-type"
      exact_basenames:
        - "component-type.yaml"
        - "component-type.yml"
    - role: "release-binding"
      prefixes:
        - "release-binding-"
      extensions:
        - ".yaml"
        - ".yml"
    - role: "release-binding"
      exact_basenames:
        - "release-binding.yaml"
        - "release-binding.yml"
    - role: "secret-reference"
      prefixes:
        - "secret-reference-"
      extensions:
        - ".yaml"
        - ".yml"
    - role: "secret-reference"
      exact_basenames:
        - "secret-reference.yaml"
        - "secret-reference.yml"
    - role: "rendered-release"
      prefixes:
        - "rendered-release-"
      extensions:
        - ".yaml"
        - ".yml"
    - role: "rendered-release"
      exact_basenames:
        - "rendered-release.yaml"
        - "rendered-release.yml"
    - role: "rendered-manifest"
      path_prefixes:
        - "rendered/"
      extensions:
        - ".yaml"
        - ".yml"
  role_owners:
    component-type: "platform-engineer"
    release-binding: "environment-owner"
    rendered-manifest: "platform-runtime"
    rendered-release: "platform-runtime"
    secret-reference: "security-team"
    workload: "app-team"
  role_schema_refs:
    component-type: "https://schema.confighub.dev/generators/openchoreo-component-type-v1"
    release-binding: "https://schema.confighub.dev/generators/openchoreo-release-binding-v1"
    rendered-manifest: "https://schema.confighub.dev/kubernetes/resource-v1"
    rendered-release: "https://schema.confighub.dev/generators/openchoreo-rendered-release-v1"
    secret-reference: "https://schema.confighub.dev/generators/openchoreo-secret-reference-v1"
    workload: "https://schema.confighub.dev/generators/openchoreo-workload-v1"
  wet_targets:
    - kind: "RenderedRelease"
      name_template: "{{name}}-prod"
      owner: "platform-runtime"
      namespace: "apps"
      source_dry_path_template: "spec"
    - kind: "Deployment"
      name_template: "{{name}}"
      owner: "platform-runtime"
      namespace: "apps"
      source_dry_path_template: "spec.containers.main.image"
    - kind: "Service"
      name_template: "{{name}}"
      owner: "platform-runtime"
      namespace: "apps"
      source_dry_path_template: "spec.service.port"
    - kind: "Secret"
      name_template: "{{name}}-secret-ref"
      owner: "security-team"
      namespace: "apps"
      source_dry_path_template: "spec.secretRef"
provenance:
  field_origin_transform: "openchoreo-release-render"
  field_origin_overlay_transform: "openchoreo-environment-binding"
  field_origin_confidences:
    env_var: 0.84
    image: 0.88
    platform_default: 0.78
    resource_limit: 0.80
    secret_ref: 0.86
    service_port: 0.82
  rendered_lineage_templates:
    - kind: "RenderedRelease"
      name_template: "{{name}}-prod"
      namespace: "apps"
      source_path_hint: "rendered_release_path"
      source_dry_path_template: "spec"
    - kind: "Deployment"
      name_template: "{{name}}"
      namespace: "apps"
      source_path_hint: "workload_path"
      source_dry_path_template: "spec.containers.main.image"
    - kind: "Deployment"
      name_template: "{{name}}"
      namespace: "apps"
      source_path_hint: "release_binding_path"
      source_dry_path_template: "spec.environment.env.LOG_LEVEL"
    - kind: "Deployment"
      name_template: "{{name}}"
      namespace: "apps"
      source_path_hint: "secret_reference_path"
      source_dry_path_template: "spec.secretRef"
    - kind: "Service"
      name_template: "{{name}}"
      namespace: "apps"
      source_path_hint: "component_type_path"
      source_dry_path_template: "spec.service.port"
inverse:
  inverse_patch_templates:
    env_var:
      editable_by: "environment-owner"
      confidence: 0.84
    image:
      editable_by: "app-team"
      confidence: 0.88
    platform_default:
      editable_by: "platform-engineer"
      confidence: 0.78
      requires_review: true
    resource_limit:
      editable_by: "platform-engineer"
      confidence: 0.80
      requires_review: true
    secret_ref:
      editable_by: "security-team"
      confidence: 0.86
      requires_review: true
    service_port:
      editable_by: "platform-engineer"
      confidence: 0.82
      requires_review: true
  inverse_pointer_templates:
    env_var:
      owner: "environment-owner"
      confidence: 0.84
    image:
      owner: "app-team"
      confidence: 0.88
    platform_default:
      owner: "platform-engineer"
      confidence: 0.78
    resource_limit:
      owner: "platform-engineer"
      confidence: 0.80
    secret_ref:
      owner: "security-team"
      confidence: 0.86
    service_port:
      owner: "platform-engineer"
      confidence: 0.82
  inverse_patch_reasons:
    env_var: "Environment values flow through the environment/release binding."
    image: "Container image is app-owned Workload intent."
    platform_default: "Platform defaults are owned by the ComponentType or platform policy, not generated Deployment YAML."
    resource_limit: "Resource limits are environment/platform-owned policy defaults."
    secret_ref: "Secret references are security-owned bindings and should not be edited on generated resources."
    service_port: "Service port is constrained by the ComponentType platform contract."
  inverse_edit_hints:
    env_var: "Route: apply-here. Edit environment binding data in {{release_binding_path}}."
    image: "Route: lift-upstream. Edit spec.containers.main.image in {{workload_path}}."
    platform_default: "Route: block/escalate. Edit the platform default in {{component_type_path}} or platform policy, not the generated Deployment."
    resource_limit: "Route: overlay. Keep this as an environment/platform overlay in {{release_binding_path}} or policy."
    secret_ref: "Route: block/escalate. Edit {{secret_reference_path}} through the security-owned secret flow."
    service_port: "Route: lift-upstream. Edit the service port contract in {{component_type_path}}."
hints:
  defaults:
    component_type_path: "component-type.yaml"
    release_binding_path: "release-binding.yaml"
    rendered_manifest_path: "rendered/deployment.yaml"
    rendered_release_path: "rendered-release.yaml"
    secret_reference_path: "secret-reference.yaml"
    workload_path: "workload.yaml"
